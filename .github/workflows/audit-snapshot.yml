name: Audit source snapshot

on:
  push:
    branches: ['fix/h-i-consistency-20260909']
    paths: ['.github/workflows/audit-snapshot.yml']

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked sources only
        run: git archive --format=tar HEAD > "$RUNNER_TEMP/tryggsignal-source.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: tryggsignal-audit-source
          path: ${{ runner.temp }}/tryggsignal-source.tar
          retention-days: 3
          if-no-files-found: error
