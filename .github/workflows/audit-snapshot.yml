name: Audit source snapshot

on:
  push:
    branches: ['fix/h-i-consistency-20260909']
    paths: ['.github/workflows/audit-snapshot.yml']

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Capture tracked source and pinned offline formatter
        run: |
          git archive --format=tar HEAD > "$RUNNER_TEMP/tryggsignal-source.tar"
          npm pack prettier@3.4.2 --pack-destination "$RUNNER_TEMP"
      - name: Generate migration skeleton with verified CLI syntax
        run: |
          supabase --version
          supabase migration new --help
          supabase migration new i_durable_import
          cp supabase/migrations/*_i_durable_import.sql "$RUNNER_TEMP/"
      - uses: actions/upload-artifact@v4
        with:
          name: tryggsignal-audit-source
          path: |
            ${{ runner.temp }}/tryggsignal-source.tar
            ${{ runner.temp }}/prettier-3.4.2.tgz
            ${{ runner.temp }}/*_i_durable_import.sql
          retention-days: 3
          if-no-files-found: error
