name: H final reviewed consistency changes
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/h-generic-integration-adapters'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/h-generic-integration-adapters
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply reviewed source and SQL patches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def patch(file, old, new):
              p = Path(file)
              value = p.read_text()
              if value.count(old) != 1:
                  raise SystemExit(f'Patch anchor mismatch in {file}: {old[:80]!r}')
              p.write_text(value.replace(old, new, 1))
          def append(file, content):
              p = Path(file)
              p.write_text(p.read_text().rstrip() + '\n\n' + content.strip() + '\n')
          append('packages/integrations/src/idempotency.ts', r'''
          /** H receipt identity uses a framed JSON tuple; a separator in a source
           * identifier cannot alias another event. Existing legacy write keys above
           * deliberately retain their format, so this change cannot replay old writes.
           * The prefix is the receipt-key codec version, not a mapping release.
           */
          export function inboundEventKey(parts: {
            readonly connectorInstanceId: string;
            readonly externalEventId: string;
            readonly eventType: string;
          }): string {
            const values = [parts.connectorInstanceId, parts.externalEventId, parts.eventType];
            const limits = [500, 500, 200];
            if (values.some((value, index) =>
              !value.trim() || value !== value.trim() || value.length > (limits[index] ?? 0) ||
              /[\u0000-\u001f\u007f]/.test(value)
            )) {
              throw new Error('Inbound event identity contains invalid values');
            }
            const encoded = JSON.stringify(['tryggsignal-inbound-event/v1', ...values]);
            return 'event:v1:' + createHash('sha256').update(encoded).digest('hex');
          }
          ''')
          transport = 'packages/integrations/src/transport-adapters.ts'
          patch(transport, "import { idempotencyKey } from './idempotency';", "import { inboundEventKey } from './idempotency';")
          patch(transport, '''      idempotencyKey: idempotencyKey({
                  connectorInstanceId,
                  entityType: 'event',
                  externalId: externalEventId,
                  operation: eventType,
                  sourceVersion: null, // Mapping release is not logical event identity.
                }),''', '''      idempotencyKey: inboundEventKey({ connectorInstanceId, externalEventId, eventType }),''')
          patch(transport, '''export interface WebhookRequest {
            readonly headers: Readonly<Record<string, string | undefined>>;
            readonly body: unknown;
          }''', '''export interface WebhookRequest {
            readonly headers: Readonly<Record<string, string | undefined>>;
            readonly body: unknown;
            /** Unmodified HTTP bytes for source-specific signature verification.
             * A byte-signature verifier must reject requests where this is absent.
             */
            readonly rawBody?: Uint8Array;
          }''')
          p = Path(transport)
          value = p.read_text()
          start = value.index('function parseCsvLine(')
          end = value.index('function parseFilePayload(', start)
          parser = r'''
          function parseCsv(text: string, delimiter: string): readonly Record<string, string>[] {
            if (delimiter.length !== 1 || ['"', '\r', '\n'].includes(delimiter)) {
              throw new Error('CSV delimiter must be one non-quote, non-newline character');
            }
            const input = text.replace(/^\uFEFF/, '');
            const rows: string[][] = [];
            let row: string[] = [];
            let field = '';
            let quoted = false;
            let afterQuote = false;
            let rowStarted = false;
            const finishField = (): void => {
              row.push(field);
              field = '';
              afterQuote = false;
            };
            const finishRow = (): void => {
              if (!rowStarted && row.length === 0 && field.length === 0) return;
              finishField();
              rows.push(row);
              row = [];
              rowStarted = false;
            };
            for (let index = 0; index < input.length; index += 1) {
              const character = input[index] ?? '';
              if (quoted) {
                if (character === '"') {
                  if (input[index + 1] === '"') { field += '"'; index += 1; }
                  else { quoted = false; afterQuote = true; }
                } else { field += character; }
                continue;
              }
              if (character === delimiter) {
                rowStarted = true;
                finishField();
              } else if (character === '\r' || character === '\n') {
                finishRow();
                if (character === '\r' && input[index + 1] === '\n') index += 1;
              } else if (character === '"' && field.length === 0 && !afterQuote) {
                rowStarted = true;
                quoted = true;
              } else {
                if (afterQuote || character === '"') throw new Error('CSV contains invalid quoting');
                rowStarted = true;
                field += character;
              }
            }
            if (quoted) throw new Error('CSV contains an unterminated quoted field');
            finishRow();
            const headers = rows.shift()?.map((header) => header.trim());
            if (headers === undefined) return [];
            if (headers.some((header) => !header)) throw new Error('CSV contains an empty header');
            if (new Set(headers).size !== headers.length) throw new Error('CSV contains duplicate headers');
            return rows.map((values) => {
              if (values.length !== headers.length) throw new Error('CSV row column count does not match the header');
              return Object.fromEntries(headers.map((header, index) => [header, values[index] ?? '']));
            });
          }

          '''
          p.write_text(value[:start] + parser.lstrip() + value[end:])
          migration = 'supabase/migrations/20260909100500_h_generic_integration_adapters.sql'
          append(migration, '''
          -- Receipt content is immutable even beneath the service RPC. Retry/duplicate
          -- metadata may change; replay cannot rewrite source evidence in place.
          create or replace function integration.guard_receipt_content()
          returns trigger language plpgsql security invoker set search_path = '' as $receipt_guard$
          begin
            if row(new.id, new.connector_instance_id, new.authority_id, new.external_event_id,
                   new.event_type, new.idempotency_key, new.payload, new.source_hash,
                   new.mapping_version, new.received_at)
               is distinct from
               row(old.id, old.connector_instance_id, old.authority_id, old.external_event_id,
                   old.event_type, old.idempotency_key, old.payload, old.source_hash,
                   old.mapping_version, old.received_at) then
              raise exception 'Received integration evidence is immutable' using errcode = 'check_violation';
            end if;
            return new;
          end;
          $receipt_guard$;
          revoke all on function integration.guard_receipt_content() from public, anon, authenticated;
          create trigger integration_receipt_content_immutable
            before update on integration.integration_events
            for each row execute function integration.guard_receipt_content();

          create or replace function integration.guard_reconciliation_history()
          returns trigger language plpgsql security invoker set search_path = '' as $reconciliation_guard$
          begin
            raise exception 'Reconciliation history is append-only; record a new run'
              using errcode = 'check_violation';
          end;
          $reconciliation_guard$;
          revoke all on function integration.guard_reconciliation_history() from public, anon, authenticated;
          create trigger integration_reconciliation_no_update
            before update on integration.reconciliation_runs
            for each row execute function integration.guard_reconciliation_history();
          ''')
          patch('tests/integration/integration_consistency.sql',
              '-- Same validation in RPC and table: no impossible GREEN or negative/subset counts.',
              '''-- Direct privileged writes must not corrupt immutable receipt evidence.
          do $immutability$
          declare v_instance uuid := (select id from hq_ids where key='instance');
          begin
            perform pg_temp.hq_reject(format(
              'update integration.integration_events set payload=''{}'' where connector_instance_id=%L', v_instance),'23514');
            perform pg_temp.hq_reject(format(
              'update integration.integration_events set mapping_version=''replaced'' where connector_instance_id=%L', v_instance),'23514');
          end;
          $immutability$;

          -- Same validation in RPC and table: no impossible GREEN or negative/subset counts.''')
          patch('tests/unit/integration-consistency.test.ts',
              '  GenericInboundWebhookConnector,',
              '  GenericFileConnector,\n  GenericInboundWebhookConnector,\n  inboundEventKey,')
          append('tests/unit/integration-consistency.test.ts', r'''
          describe('H unambiguous event identity and CSV record boundaries', () => {
            it('frames event identity so separators cannot alias distinct inputs', () => {
              expect(inboundEventKey({ connectorInstanceId: 'one', externalEventId: 'a|b', eventType: 'c' }))
                .not.toBe(inboundEventKey({ connectorInstanceId: 'one', externalEventId: 'a', eventType: 'b|c' }));
              expect(inboundEventKey({ connectorInstanceId: 'one', externalEventId: 'event', eventType: 'changed' }))
                .toMatch(/^event:v1:[a-f0-9]{64}$/);
            });
            it('rejects identities that the database would trim into another identity', () => {
              expect(() => inboundEventKey({ connectorInstanceId: 'one', externalEventId: 'event ', eventType: 'changed' }))
                .toThrow(/identity/);
            });
            function csv(text: string) {
              return new GenericFileConnector({ key: 'csv', format: 'CSV', caseMapping: mapping, capabilities: ['listCases'] }, {
                healthCheck: vi.fn(),
                list: async () => ({ items: [{ path: 'fixture.csv' }], nextCursor: null }),
                read: async () => text,
              });
            }
            it('preserves CRLF, delimiters and escaped quotes inside a quoted field', async () => {
              const adapter = csv('id,number,title,status\r\n1,C-1,"Line one\r\nLine ""two"", end",OPEN\r\n');
              const result = await adapter.listCases(null);
              expect(result.items).toHaveLength(1);
              expect(result.items[0]?.title).toBe('Line one\r\nLine "two", end');
            });
            it.each(['id,number,title,status\n1,C-1,"never closed,OPEN', 'id,number,title,status\n1,C-1,"closed"junk,OPEN'])
              ('rejects malformed CSV rather than changing data: %s', async (text) => {
                await expect(csv(text).listCases(null)).rejects.toThrow(/CSV/);
              });
          });
          ''')
          append('docs/integrations/data-contracts.md', '''
          ## Immutable receipt and history

          Incoming H webhooks use a version-tagged JSON tuple event key (`event:v1:`), not separator-concatenated identifiers. Mapping version is separate provenance, never a new logical event identity. Existing legacy write-key generation is unchanged for backwards compatibility. A trigger prevents in-place modification of receipt identity, scope, original payload, hash, mapping version and receipt timestamp; retries may only update operational metadata. Reconciliation updates are rejected: each new result is a new historical run. Retention/deletion remains a separate privileged policy, not a client operation.

          Signature verifiers receive optional unmodified `rawBody` bytes. A provider that signs raw HTTP bytes must require that buffer and reject its absence; reserializing parsed JSON is not equivalent. No live provider signature contract is invented here. The CSV adapter preserves quoted multiline records and escaped quotes, and rejects malformed quoting rather than shifting row boundaries.
          ''')
          PY
      - run: pnpm install --frozen-lockfile
      - name: Format only reviewed code and documents
        run: |
          pnpm exec prettier --write packages/integrations/src/idempotency.ts packages/integrations/src/transport-adapters.ts tests/unit/integration-consistency.test.ts docs/integrations/data-contracts.md
          git diff --check
      - name: Commit source changes on this branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/integrations/src/idempotency.ts packages/integrations/src/transport-adapters.ts tests/unit/integration-consistency.test.ts supabase/migrations/20260909100500_h_generic_integration_adapters.sql tests/integration/integration_consistency.sql docs/integrations/data-contracts.md
          git commit -m 'fix(h): seal receipt evidence and frame event identities'
          git push origin HEAD:feat/h-generic-integration-adapters
