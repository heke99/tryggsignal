name: H reviewed consistency patch
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/h-generic-integration-adapters'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/h-generic-integration-adapters
          fetch-depth: 2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Reuse the already reviewed exact-match source patch
        run: |
          python3 - <<'PY'
          import subprocess
          import textwrap
          reviewed = subprocess.check_output([
              'git', 'show', '537d7fc6866311b43a3442e13bf8bfada3c95693:.github/workflows/h-consistency-apply.yml'
          ], text=True)
          body = reviewed.split("          python3 - <<'PY'\n", 1)[1].split('\n          PY', 1)[0]
          exec(compile(textwrap.dedent(body), '<reviewed-H-patch>', 'exec'))
          PY
          # Workflow updates use the authorized connector, not the runner token.
          git restore -- .github/workflows/release.yml
      - run: pnpm install --frozen-lockfile
      - name: Format reviewed source changes
        run: |
          pnpm exec prettier --write packages/integrations/src/*.ts services/worker/src/handlers/integration-inbound.ts tests/unit/integration*.test.ts docs/integrations/data-contracts.md docs/integrations/connector-contract.md
          git diff --check
      - name: Commit source changes to this PR only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/integrations/src services/worker/src/handlers/integration-inbound.ts tests/unit/integration-consistency.test.ts tests/unit/integrations.test.ts docs/integrations/data-contracts.md docs/integrations/connector-contract.md
          if ! git diff --cached --quiet; then
            git commit -m 'fix(h): apply reviewed consistency contract and formatting'
            git push origin HEAD:feat/h-generic-integration-adapters
          fi
