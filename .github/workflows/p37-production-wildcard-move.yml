name: P37 production wildcard move

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  move-wildcard:
    name: move wildcard to canonical platform project
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TEAM_ID: team_e3htkJPyBNSw3Ix1KQLlf180
      SOURCE_PROJECT_ID: prj_NI9LHIc4U43AntT0FJi3gDXMxeH5
      TARGET_PROJECT_ID: prj_VPfXBP3n40ZyLprbva7G74tedLpZ
      DOMAIN_PATH: '%2A.tryggsignal.se'
    steps:
      - name: Require production credential
        run: test -n "$VERCEL_TOKEN"

      - name: Preflight exact project ownership
        shell: bash
        run: |
          set -euo pipefail
          source_code=$(curl -sS -o source.json -w '%{http_code}' \
            "https://api.vercel.com/v9/projects/$SOURCE_PROJECT_ID/domains/$DOMAIN_PATH?teamId=$TEAM_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN")
          target_code=$(curl -sS -o target.json -w '%{http_code}' \
            "https://api.vercel.com/v9/projects/$TARGET_PROJECT_ID/domains/$DOMAIN_PATH?teamId=$TEAM_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN")

          if [ "$target_code" = "200" ]; then
            node -e "const x=require('./target.json'); if(x.name!=='*.tryggsignal.se'||x.projectId!==process.env.TARGET_PROJECT_ID) process.exit(1)"
            echo already_moved=1 >> "$GITHUB_ENV"
          else
            test "$source_code" = "200"
            node -e "const x=require('./source.json'); if(x.name!=='*.tryggsignal.se'||x.projectId!==process.env.SOURCE_PROJECT_ID) process.exit(1)"
            echo already_moved=0 >> "$GITHUB_ENV"
          fi

      - name: Move wildcard
        if: env.already_moved != '1'
        shell: bash
        run: |
          set -euo pipefail
          body=$(printf '{"projectId":"%s"}' "$TARGET_PROJECT_ID")
          code=$(curl -sS -o moved.json -w '%{http_code}' \
            -X POST "https://api.vercel.com/v1/projects/$SOURCE_PROJECT_ID/domains/$DOMAIN_PATH/move?teamId=$TEAM_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$body")
          test "$code" = "200"
          node -e "const x=require('./moved.json'); if(x.name!=='*.tryggsignal.se'||x.projectId!==process.env.TARGET_PROJECT_ID) process.exit(1)"

      - name: Require verified target association
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o post.json -w '%{http_code}' \
            "https://api.vercel.com/v9/projects/$TARGET_PROJECT_ID/domains/$DOMAIN_PATH?teamId=$TEAM_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN")
          test "$code" = "200"
          node -e "const x=require('./post.json'); if(x.name!=='*.tryggsignal.se'||x.projectId!==process.env.TARGET_PROJECT_ID||x.verified!==true) process.exit(1); console.log('verified target association')"

      - name: Production smoke
        run: |
          curl --fail --silent --show-error --location https://app.tryggsignal.se/ >/dev/null
          curl --fail --silent --show-error --location https://kommuner.tryggsignal.se/ >/dev/null
