name: P37 wildcard move

on:
  push:
    branches:
      - feat/p37-custom-domains

permissions:
  contents: write

jobs:
  move-wildcard:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TEAM_ID: team_e3htkJPyBNSw3Ix1KQLlf180
      SOURCE_PROJECT_ID: prj_NI9LHIc4U43AntT0FJi3gDXMxeH5
      TARGET_PROJECT_ID: prj_VPfXBP3n40ZyLprbva7G74tedLpZ
      DOMAIN_PATH: '%2A.tryggsignal.se'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p37-custom-domains
      - name: Move wildcard with hard preflight and persist sanitized result
        shell: bash
        run: |
          set -u
          RESULT=BLOCKED:UNKNOWN

          finish() {
            printf '%s\n' "$RESULT" > .p37-wildcard-result
            rm -f .github/workflows/p37-wildcard-move.yml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "ops(p37): record wildcard move result" || true
            git push origin HEAD:feat/p37-custom-domains
          }

          if [ -z "${VERCEL_TOKEN:-}" ]; then
            RESULT=BLOCKED:MISSING_VERCEL_TOKEN
            finish
            exit 0
          fi

          source_code=$(curl -sS -o source.json -w '%{http_code}' \
            "https://api.vercel.com/v9/projects/$SOURCE_PROJECT_ID/domains/$DOMAIN_PATH?teamId=$TEAM_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" || printf 000)
          target_code=$(curl -sS -o target.json -w '%{http_code}' \
            "https://api.vercel.com/v9/projects/$TARGET_PROJECT_ID/domains/$DOMAIN_PATH?teamId=$TEAM_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" || printf 000)

          if [ "$target_code" = "200" ]; then
            if node -e "const x=require('./target.json'); if(x.name!=='*.tryggsignal.se'||x.projectId!==process.env.TARGET_PROJECT_ID||x.verified!==true) process.exit(1)"; then
              moved=1
            else
              RESULT=BLOCKED:TARGET_STATE_MISMATCH
              finish
              exit 0
            fi
          elif [ "$source_code" = "200" ]; then
            if ! node -e "const x=require('./source.json'); if(x.name!=='*.tryggsignal.se'||x.projectId!==process.env.SOURCE_PROJECT_ID) process.exit(1)"; then
              RESULT=BLOCKED:SOURCE_STATE_MISMATCH
              finish
              exit 0
            fi
            body=$(printf '{"projectId":"%s"}' "$TARGET_PROJECT_ID")
            move_code=$(curl -sS -o moved.json -w '%{http_code}' \
              -X POST "https://api.vercel.com/v1/projects/$SOURCE_PROJECT_ID/domains/$DOMAIN_PATH/move?teamId=$TEAM_ID" \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H 'Content-Type: application/json' \
              --data "$body" || printf 000)
            if [ "$move_code" != "200" ]; then
              RESULT="BLOCKED:MOVE_HTTP_$move_code"
              finish
              exit 0
            fi
          else
            RESULT="BLOCKED:PREFLIGHT_SOURCE_${source_code}_TARGET_${target_code}"
            finish
            exit 0
          fi

          post_code=$(curl -sS -o post.json -w '%{http_code}' \
            "https://api.vercel.com/v9/projects/$TARGET_PROJECT_ID/domains/$DOMAIN_PATH?teamId=$TEAM_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" || printf 000)
          if [ "$post_code" != "200" ]; then
            RESULT="BLOCKED:POSTFLIGHT_HTTP_$post_code"
            finish
            exit 0
          fi
          if ! node -e "const x=require('./post.json'); if(x.name!=='*.tryggsignal.se'||x.projectId!==process.env.TARGET_PROJECT_ID||x.verified!==true) process.exit(1)"; then
            RESULT=BLOCKED:POSTFLIGHT_STATE
            finish
            exit 0
          fi

          if ! curl --fail --silent --show-error --location https://app.tryggsignal.se/ >/dev/null; then
            RESULT=BLOCKED:APP_SMOKE
            finish
            exit 0
          fi
          if ! curl --fail --silent --show-error --location https://kommuner.tryggsignal.se/ >/dev/null; then
            RESULT=BLOCKED:KOMMUNER_SMOKE
            finish
            exit 0
          fi

          RESULT=GREEN
          finish
