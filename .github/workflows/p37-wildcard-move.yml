name: P37 wildcard move

on:
  push:
    branches:
      - feat/p37-custom-domains

permissions:
  contents: write

jobs:
  move-wildcard:
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TEAM_ID: team_e3htkJPyBNSw3Ix1KQLlf180
      SOURCE_PROJECT_ID: prj_NI9LHIc4U43AntT0FJi3gDXMxeH5
      TARGET_PROJECT_ID: prj_VPfXBP3n40ZyLprbva7G74tedLpZ
      DOMAIN: '*.tryggsignal.se'
      DOMAIN_PATH: '%2A.tryggsignal.se'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p37-custom-domains
      - name: Require production credential
        run: test -n "$VERCEL_TOKEN"
      - name: Preflight exact ownership
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $VERCEL_TOKEN")
          q="teamId=$TEAM_ID"
          source_code=$(curl -sS -o source.json -w '%{http_code}' "https://api.vercel.com/v9/projects/$SOURCE_PROJECT_ID/domains/$DOMAIN_PATH?$q" "${auth[@]}")
          target_code=$(curl -sS -o target.json -w '%{http_code}' "https://api.vercel.com/v9/projects/$TARGET_PROJECT_ID/domains/$DOMAIN_PATH?$q" "${auth[@]}")
          echo "source_http=$source_code target_http=$target_code"
          if [ "$target_code" = "200" ]; then
            node -e "const x=require('./target.json'); if(x.name!=='*.tryggsignal.se'||x.projectId!==process.env.TARGET_PROJECT_ID) process.exit(1)"
            echo 'Wildcard already belongs to intended target; move is idempotently complete.'
            echo already_moved=1 >> "$GITHUB_ENV"
            exit 0
          fi
          test "$source_code" = "200"
          node -e "const x=require('./source.json'); if(x.name!=='*.tryggsignal.se'||x.projectId!==process.env.SOURCE_PROJECT_ID) process.exit(1)"
          echo already_moved=0 >> "$GITHUB_ENV"
      - name: Move wildcard to intended platform project
        if: env.already_moved != '1'
        shell: bash
        run: |
          set -euo pipefail
          body=$(printf '{"projectId":"%s"}' "$TARGET_PROJECT_ID")
          code=$(curl -sS -o moved.json -w '%{http_code}' \
            -X POST "https://api.vercel.com/v1/projects/$SOURCE_PROJECT_ID/domains/$DOMAIN_PATH/move?teamId=$TEAM_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$body")
          cat moved.json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const x=JSON.parse(s); if(x.name!=='*.tryggsignal.se'||x.projectId!==process.env.TARGET_PROJECT_ID) process.exit(1); console.log(JSON.stringify({name:x.name,projectId:x.projectId,verified:x.verified}))})"
          test "$code" = "200"
      - name: Postflight association and verification
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o post.json -w '%{http_code}' \
            "https://api.vercel.com/v9/projects/$TARGET_PROJECT_ID/domains/$DOMAIN_PATH?teamId=$TEAM_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN")
          test "$code" = "200"
          node -e "const x=require('./post.json'); if(x.name!=='*.tryggsignal.se'||x.projectId!==process.env.TARGET_PROJECT_ID||x.verified!==true) process.exit(1); console.log(JSON.stringify({name:x.name,projectId:x.projectId,verified:x.verified}))"
      - name: Platform wildcard smoke
        run: |
          curl --fail --silent --show-error --location https://app.tryggsignal.se/ >/dev/null
          curl --fail --silent --show-error --location https://kommuner.tryggsignal.se/ >/dev/null
      - name: Remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/p37-wildcard-move.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(p37): remove completed wildcard move workflow"
          git push origin HEAD:feat/p37-custom-domains
