name: P39 one-shot format

on:
  push:
    branches:
      - feat/p39-tenant-provisioning

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p39-tenant-provisioning
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:write
      - name: Commit formatting and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/p39-one-shot-format.yml
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(p39): apply repository formatting"
          git push origin HEAD:feat/p39-tenant-provisioning
