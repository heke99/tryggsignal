name: Phase I migration scaffold

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/i-migration-bootstrap.yml']

permissions:
  contents: write

jobs:
  scaffold:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/i-migration-golden-dataset'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/i-migration-golden-dataset
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Verify CLI and generate one unapplied migration
        shell: bash
        run: |
          set -euo pipefail
          supabase --version
          supabase migration new --help
          if find supabase/migrations -name '*_i_migration_golden_dataset.sql' -print -quit | grep -q .; then
            echo 'Migration already scaffolded'
            exit 0
          fi
          supabase migration new i_migration_golden_dataset
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations/*_i_migration_golden_dataset.sql
          git commit -m 'chore(i): add CLI-generated migration scaffold'
          git push origin HEAD:feat/i-migration-golden-dataset
