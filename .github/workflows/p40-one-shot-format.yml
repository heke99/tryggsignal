name: P40 one-shot format

on:
  push:
    branches:
      - feat/p40-domain-whitelabel-hardening

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p40-domain-whitelabel-hardening
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write tests/unit/cache-key.test.ts
      - name: Commit exact formatting and remove helper
        shell: bash
        run: |
          rm .github/workflows/p40-one-shot-format.yml
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(p40): apply repository formatting"
          git push origin HEAD:feat/p40-domain-whitelabel-hardening
